alias: Special load when both work areas are occupied
mode: parallel
max: 10
trigger:
  - platform: state
    entity_id:
      - occupancy.cam_01
      - occupancy.cam_02
    to: "on"
condition:
  - condition: and
    conditions:
      - condition: state
        entity_id: occupancy.cam_01
        state: "on"
      - condition: state
        entity_id: occupancy.cam_02
        state: "on"
action:
  - service: switch.turn_on
    target:
      entity_id: switch.wall_02_1
